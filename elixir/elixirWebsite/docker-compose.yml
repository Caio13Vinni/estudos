services:
  app:
    build: .
    ports:
      - "4002:4002"
    volumes:
      - .:/app
      - /app/deps
      - /app/_build
    command: mix phx.server
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db/schubert_website_dev
      - MIX_ENV=dev
      - PORT=4002
    stdin_open: true
    tty: true

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: schubert_website_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: